databaseChangeLog:
  - changeSet:
      id: "1"
      author: "Leo-arch-eng"
      changes:
        - createTable:
            tableName: "author"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: "name"
                  type: "varchar(50)"
                  constraints:
                    nullable: true
              - column:
                  name: "surname"
                  type: "varchar(50)"
                  constraints:
                    nullable: true
              - column:
                  name: "authorid"
                  type: "bigint"
                  constraints:
                    nullable: true

  - changeSet:
      id: "2"
      author: "Leo-arch-eng"
      changes:
        - createTable:
            tableName: "comment"
            columns:
              - column:
                  name: "comment_id"
                  type: "bigint"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: "author"
                  type: "varchar(50)"
              - column:
                  name: "comment"
                  type: "varchar(255)"
              - column:
                  name: "date"
                  type: "timestamp"
              - column:
                  name: "message_id"
                  type: "bigint"

  - changeSet:
      id: "3"
      author: "Leo-arch-eng"
      changes:
        - createTable:
            tableName: "message"
            columns:
              - column:
                  name: "message_id"
                  type: "bigint"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: "author_name"
                  type: "varchar(50)"
              - column:
                  name: "author_surname"
                  type: "varchar(50)"
              - column:
                  name: "local_date"
                  type: "timestamp"
              - column:
                  name: "message"
                  type: "varchar(500)"
              - column:
                  name: "topic_id"
                  type: "bigint"

  - changeSet:
      id: "4"
      author: "Leo-arch-eng"
      changes:
        - createTable:
            tableName: "topic"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: "description"
                  type: "varchar(255)"
              - column:
                  name: "ttitle"
                  type: "varchar(255)"